services:
  api:
    build: ./backend
    environment:
      PORT: "8080"
    ports:
      - "8081:8080" # exposed for debugging; the web service talks to it internally
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80" # open http://localhost:8080
    restart: unless-stopped
